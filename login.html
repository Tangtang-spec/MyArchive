<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style_login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>เข้าสู่ระบบ</h2>
                <p>ยินดีต้อนรับกลับเข้าสู่ระบบ</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">อีเมล</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">รหัสผ่าน</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me"> จำการเข้าสู่ระบบ
                    </label>
                    <a href="#" id="forgot-password" class="forgot-pass">ลืมรหัสผ่าน?</a>
                </div>

                <button type="submit" class="btn-auth">เข้าสู่ระบบ</button>
            </form>

            <div class="auth-divider">หรือ</div>

            <button type="button" id="btn-google-login" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                เข้าสู่ระบบด้วย Google
            </button>

            <div class="auth-footer">
                ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a>
            </div>
        </div>
    </div>

    <!-- Popup Modal แจ้งเตือน -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card">
            <div id="modal-icon" class="modal-icon"></div>
            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>
            <button id="modal-btn" class="btn-auth">ตกลง</button>
        </div>
    </div>

    <script type="module" src="script/auth.js"></script>
</body>
</html>
