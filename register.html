<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style_login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>สมัครสมาชิก</h2>
                <p>สร้างบัญชีใหม่เพื่อเริ่มต้นใช้งาน</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">ชื่อผู้ใช้งาน</label>
                    <input type="text" id="reg-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">อีเมล</label>
                    <input type="email" id="reg-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">รหัสผ่าน</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>

                <label class="terms-condition">
                    <input type="checkbox" id="terms" required>
                    ฉันยอมรับข้อตกลงและเงื่อนไขการใช้งาน
                </label>

                <button type="submit" class="btn-auth">ลงทะเบียน</button>
            </form>

            <div class="auth-divider">หรือ</div>

            <button type="button" id="btn-google-register" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                สมัครด้วย Google
            </button>

            <div class="auth-footer">
                มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
            </div>
        </div>
    </div>

    <!-- Popup Modal แจ้งเตือน -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card">
            <div id="modal-icon" class="modal-icon"></div>
            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>
            <button id="modal-btn" class="btn-auth">ตกลง</button>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
