<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiction Archive - My Projects</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style_project.css">
    <link rel="stylesheet" href="css/profilestyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>Fiction Archive</h2>
            </div>
            <nav class="sidebar-menu">
                <a href="homepage.html" class="menu-item"><span>🏠</span> Homepage</a>
                <a href="fictionproject.html" class="menu-item active"><span>📚</span> Fiction projects</a>
                <a href="characters.html" class="menu-item"><span>👥</span> Characters</a>
                <a href="worldbuilding.html" class="menu-item"><span>🌍</span> Worldbuilding</a>
                <a href="#" class="menu-item"><span>⏳</span> Timeline</a>
                <a href="#" class="menu-item"><span>💾</span> สำรองข้อมูล</a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar" id="user-avatar">U</div>
                    <div class="user-info">
                        <span class="username" id="user-name">กำลังโหลด...</span>
                        <span class="role" id="user-role">ผู้ใช้งาน</span>
                    </div>

                    <div class="profile-dropdown">
                        <a href="profile.html" class="dropdown-item"><span>👤</span> โปรไฟล์ (Profile)</a>
                        <a href="settings.html" class="dropdown-item"><span>⚙️</span> การตั้งค่า</a>
                        <hr style="border: 0; border-top: 1px solid #142126; margin: 6px 0;">
                        <a href="#" class="dropdown-item logout-item" id="btn-logout"><span>🚪</span> ออกจากระบบ</a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content (เต็มพื้นที่ 2 คอลัมน์) -->
        <main class="main-content" style="grid-column: span 2;">
            <header class="main-header">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="ค้นหาชื่อโปรเจกต์ หรือคำอธิบาย...">
                </div>
                <button class="btn-create" id="btn-open-modal">+ New Project</button>
            </header>

            <section class="section-header">
                <div>
                    <h2 style="color: #ffffff; font-size: 1.6rem; margin-bottom: 4px;">โปรเจกต์ทั้งหมด</h2>
                    <p style="color: #7b8e91; font-size: 0.9rem;">จัดการและเข้าถึงคลังข้อมูลทั้งหมดของคุณ</p>
                </div>
            </section>

            <!-- หมวดหมู่สำหรับกรองข้อมูล (Genre Filter) -->
            <div class="filter-container" id="filter-container">
                <button class="btn-filter active" data-genre="all">ทั้งหมด (0)</button>
                <button class="btn-filter" data-genre="Fantasy">Fantasy</button>
                <button class="btn-filter" data-genre="Drama">Drama</button>
                <button class="btn-filter" data-genre="Sci-Fi">Sci-Fi</button>
            </div>

            <!-- แสดงรายการ Project จาก Firestore -->
            <div class="projects-grid" id="projects-container">
                <div class="loading-state">กำลังโหลดคลังโปรเจกต์...</div>
            </div>
        </main>
    </div>

    <!-- Modal หน้าต่างสร้าง New Project -->
    <div id="project-modal" class="modal-overlay">
        <div class="modal-card project-modal-card">
            <div class="modal-header">
                <h3>สร้างโปรเจกต์ใหม่</h3>
                <span class="close-modal" id="btn-close-modal">&times;</span>
            </div>
            <form id="create-project-form">
                <div class="form-group">
                    <label for="project-title">ชื่อโปรเจกต์ / นิยาย</label>
                    <input type="text" id="project-title" placeholder="เช่น ตำนานมหาสงครามเวทมนตร์" required>
                </div>
                <div class="form-group">
                    <label for="project-genre">หมวดหมู่ / ประเภท (Genre)</label>
                    <input type="text" id="project-genre" placeholder="เช่น Fantasy, Drama, Sci-Fi" required>
                </div>
                <div class="form-group">
                    <label for="project-theme">ธีมสีปกการ์ด</label>
                    <select id="project-theme" class="select-input">
                        <option value="fantasy">Fantasy (เขียวน้ำทะเลดาร์ก)</option>
                        <option value="drama">Drama (น้ำเงินเข้ม)</option>
                        <option value="scifi">Sci-Fi (เทาเข้ม / นีออน)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="project-desc">คำอธิบายย่อ</label>
                    <textarea id="project-desc" rows="3" placeholder="เรื่องย่อสั้นๆ หรือแนวคิดของเรื่อง..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btn-cancel-modal">ยกเลิก</button>
                    <button type="submit" class="btn-auth">สร้างโปรเจกต์</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK & Controller logic -->
    <script type="module" src="script/fictionproject.js"></script>
    <script type="module" src="script/homepage.js"></script>
</body>
</html>
